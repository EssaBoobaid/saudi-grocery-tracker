version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: grocery_db
    restart: always
    environment:
      POSTGRES_DB: tracker_db
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # الحل الجذري: تشغيل المخطط ذاتياً لحظة إقلاع قاعدة البيانات
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery_user -d tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: grocery_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://grocery_user:grocery_password@db:5432/tracker_db
      - PYTHONPATH=/app
    volumes:
      - .:/app

volumes:
  postgres_data: